<script>
// ===== UI helper: toast =====
let __toastTimer=null;
function showToast(msg, ms){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(__toastTimer);
  __toastTimer = setTimeout(()=>el.classList.remove('show'), ms||2200);
}

// ===== 闲鱼 · AI 自主清售计划 —— PRD v3.0 公式实现 =====
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function roundToTen(v){ return Math.round(v/10)*10; }

const STRATEGY = {
  profit: { label:'收益优先', a_s:0.50, k_s:0.25, kappa_s:0.10, gamma_adj:0.08 },
  balance:{ label:'平衡出售', a_s:0.20, k_s:0,    kappa_s:0.25, gamma_adj:0    },
  fast:   { label:'尽快售出', a_s:-0.10,k_s:-0.25, kappa_s:0.35, gamma_adj:-0.06 }
};
const LIQUIDITY = { high:1.90, mid:1.60, low:1.30 };

function calcP0(Mlow, Mhigh, F, strategyKey){
  const M = (Mlow+Mhigh)/2, R = Mhigh-Mlow;
  const a_s = STRATEGY[strategyKey].a_s;
  return Math.round(clamp(M + a_s*R, F, Mhigh));
}
function calcK(strategyKey, liquidityKey){
  return clamp(LIQUIDITY[liquidityKey] + STRATEGY[strategyKey].k_s, 0.65, 2.40);
}
function calcPbase(F, P0, r, T, k){
  const ratio = T>0 ? clamp(r/T,0,1) : 0;
  return F + (P0-F) * Math.pow(ratio, k);
}
function calcQ(fav, offerStrength, supply, lowDensity){
  return clamp(0.30*fav + 0.35*offerStrength - 0.20*supply - 0.15*lowDensity, -1, 1);
}
function calcPtarget(Pbase, R, Q, F, Pcurrent){
  return clamp(Pbase + 0.08*R*Q, F, Pcurrent);
}
function stepCapForR(r){
  if(r>=15) return 0.03;
  if(r>=9)  return 0.03;
  if(r>=4)  return 0.06;
  return 0.10;
}
function stepCapLabel(r){
  if(r>=15) return 'D30–D15 · 3%';
  if(r>=9)  return 'D14–D9 · 3%';
  if(r>=4)  return 'D8–D4 · 6%';
  return 'D3–D1 · 10%';
}
function calcPnext(Pcurrent, Ptarget, F, r){
  const cap = stepCapForR(r);
  return Math.max(F, Math.max(Pcurrent*(1-cap), Ptarget));
}
function checkFreqLabel(r){
  if(r>=15) return '每周一次';
  if(r>=9)  return '每 72 小时一次';
  if(r>=4)  return '每 48 小时一次';
  return '每天一次';
}

function calcKappa(strategyKey, r){
  const kappa_s = STRATEGY[strategyKey].kappa_s;
  let urgency = 0;
  if(r>=15) urgency=0; else if(r>=8) urgency=0.05; else if(r>=4) urgency=0.10; else urgency=0.15;
  return clamp(kappa_s+urgency, 0.05, 0.45);
}
function calcL(F, Pt, kappa){
  return Math.round(Math.max(0.85*F, F - kappa*(Pt-F)));
}
function calcGamma(strategyKey, r){
  let base=0;
  if(r>=15) base=0.25; else if(r>=8) base=0.15; else if(r>=4) base=0.08; else base=0;
  return clamp(base + STRATEGY[strategyKey].gamma_adj, 0, 0.35);
}
function calcC(F, Pt, gamma){
  return Math.round(clamp(F + gamma*(Pt-F), F, Pt));
}
// 四分支判定： 'reject' | 'counter' | 'valid' | 'atprice'
function decideOffer(B, L, F, Pt){
  if(B < L) return 'reject';
  if(B < F) return 'counter';
  if(B < Pt) return 'valid';
  return 'atprice';
}

<script>
function qParam2(name){
  const u = new URL(location.href);
  return u.searchParams.get(name);
}

function returnFromOffer(){
  const from = qParam2('from');
  const demo = qParam2('mode') === 'demo' ? '?mode=demo' : '';
  location.href = (from === 'tasks' ? 'task-inbox.html' : 'price-plan.html') + demo;
}

let ctx = { F:450, strategy:'balance', r:14, P:690 };
let offerLog = [];

function init2(){
  const F = qParam2('F'), s = qParam2('strategy'), r = qParam2('r'), P = qParam2('P');
  if(F) ctx.F = Number(F);
  if(s) ctx.strategy = s;
  if(r) ctx.r = Number(r);
  if(P) ctx.P = Number(P);
  document.getElementById('ctxP').textContent = ctx.P;
  document.getElementById('ctxF').textContent = ctx.F;
  document.getElementById('ctxR').textContent = ctx.r;
  document.getElementById('offerAmount').value = 430;
}

function fmtTimePlus2h(){
  const d = new Date(Date.now() + 2*3600*1000);
  const h = String(d.getHours()).padStart(2,'0');
  const m = String(d.getMinutes()).padStart(2,'0');
  return `${h}:${m}`;
}
function randBuyerId(){
  return 'B_' + Math.random().toString(36).slice(2,6).toUpperCase();
}

function quickOffer(v){
  document.getElementById('offerAmount').value = v;
  document.getElementById('offerNote').value = '';
  submitOffer();
}
function quickOfferAtPrice(){
  document.getElementById('offerAmount').value = ctx.P;
  document.getElementById('offerNote').value = '';
  submitOffer();
}

function submitOffer(){
  const amount = Number(document.getElementById('offerAmount').value);
  const note = document.getElementById('offerNote').value.trim();
  const pickup = document.getElementById('pickupTime').value;
  if(!amount || amount<=0){ showToast('请输入有效的报价金额'); return; }

  const kappa = calcKappa(ctx.strategy, ctx.r);
  const L = calcL(ctx.F, ctx.P, kappa);
  const gamma = calcGamma(ctx.strategy, ctx.r);
  const C = calcC(ctx.F, ctx.P, gamma);

  let branch = note.length>0 ? 'manual' : decideOffer(amount, L, ctx.F, ctx.P);

  renderResult(branch, amount, { L, C, pickup, note });
  offerLog.unshift({ amount, branch, time: new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}) });
  renderLog();
}

const BRANCH_LABEL = {
  reject: '自动拒绝',
  counter: 'AI 一次还价 · 待回应',
  valid: '有效报价 · 候选交易',
  atprice: '符合公开价 · 优先确认',
  manual: '含特殊条件 · 转人工'
};

function renderResult(branch, amount, extra){
  const zone = document.getElementById('resultZone');
  let html = '';
  if(branch==='reject'){
    html = `
    <div class="card" style="border-left:4px solid var(--xy-ink-faint);margin-top:16px;">
      <div class="tag gray">自动拒绝</div>
      <div style="font-weight:800;font-size:16px;margin-top:8px;">买家报价 ¥${amount} 已自动拒绝</div>
      <div style="font-size:13px;color:var(--xy-ink-soft);margin-top:6px;line-height:1.6;">低于 AI 可尝试挽回线 L(t) = ¥${extra.L}。系统不透露底价、曲线或下一次降价时间；你未被打扰。</div>
    </div>`;
  } else if(branch==='counter'){
    html = `
    <div class="card" style="border-left:4px solid var(--xy-gold);margin-top:16px;">
      <div class="tag gold">AI 一次还价 · 待回应</div>
      <div style="font-weight:800;font-size:16px;margin-top:8px;">买家报价 ¥${amount} → AI 还价 ¥${extra.C}</div>
      <div class="explain" style="margin-top:10px;">"当前暂不能接受 ¥${amount}；若提升至 ¥${extra.C}，可为你保留 2 小时。"</div>
      <div style="font-size:12px;color:var(--xy-ink-faint);margin-top:8px;">有效期至 ${fmtTimePlus2h()}（或至下一检查节点，以更短者为准）· 该买家本商品仅可获得一次 AI 还价</div>
    </div>`;
  } else if(branch==='valid' || branch==='atprice'){
    const buyer = randBuyerId();
    const cardId = 'deal_'+Date.now();
    html = `
    <div class="card" style="border-left:4px solid var(--xy-green);margin-top:16px;" id="${cardId}">
      <div class="tag green">${BRANCH_LABEL[branch]}</div>
      <div style="font-weight:800;font-size:16px;margin-top:8px;">候选交易已生成 · ¥${amount}</div>
      <div style="font-size:13px;color:var(--xy-ink-soft);margin-top:6px;line-height:1.6;">买家 ${buyer} · 可自提：${extra.pickup}<br>商品公开价已冻结 2 小时，等待你确认</div>
      <div class="dealActions" style="display:flex;gap:10px;margin-top:14px;">
        <button class="btn btn-secondary" style="flex:1;" onclick="resolveDeal('${cardId}','reject')">拒绝</button>
        <button class="btn btn-primary" style="flex:1;" onclick="resolveDeal('${cardId}','accept')">接受</button>
      </div>
    </div>`;
  } else if(branch==='manual'){
    html = `
    <div class="card" style="border-left:4px solid var(--xy-orange);margin-top:16px;">
      <div class="tag">含特殊条件 · 转人工</div>
      <div style="font-weight:800;font-size:16px;margin-top:8px;">买家报价 ¥${amount} 附带备注</div>
      <div style="font-size:13px;color:var(--xy-ink-soft);margin-top:6px;">"${extra.note}"</div>
      <div style="font-size:12px;color:var(--xy-ink-faint);margin-top:8px;">备注含特殊条件，不进入自动规则，直接交由你处理</div>
      <button class="btn btn-secondary btn-block" style="margin-top:12px;" onclick="showToast('已跳转至聊天详情（原型未展开）')">查看详情并回复</button>
    </div>`;
  }
  zone.innerHTML = html;
}

function resolveDeal(cardId, action){
  const card = document.getElementById(cardId);
  if(!card) return;
  const actions = card.querySelector('.dealActions');
  if(action==='accept'){
    actions.outerHTML = `<div class="tag green" style="margin-top:14px;">已接受 · 请与买家确认交接细节</div>`;
    showToast('已接受候选交易');
  } else {
    actions.outerHTML = `<div class="tag gray" style="margin-top:14px;">已拒绝 · 商品已恢复在售状态</div>`;
    showToast('已拒绝，恢复在售与下一次检查节奏');
  }
}

function renderLog(){
  const zone = document.getElementById('logZone');
  if(offerLog.length===0){ zone.textContent = '暂无报价记录，试试上面的演示报价'; return; }
  zone.innerHTML = offerLog.map(item=>{
    const cls = item.branch==='reject' ? 'gray' : (item.branch==='counter' ? 'gold' : (item.branch==='manual' ? '' : 'green'));
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--xy-line);">
      <span style="font-size:13px;color:var(--xy-ink);font-weight:600;">¥${item.amount} <span style="color:var(--xy-ink-faint);font-weight:400;">· ${item.time}</span></span>
      <span class="tag ${cls}">${BRANCH_LABEL[item.branch]}</span>
    </div>`;
  }).join('');
}

init2();

</script>
