<style>
:root{
  --xy-orange:#FF4B10;
  --xy-orange-deep:#DE3900;
  --xy-orange-soft:#FFF0EA;
  --xy-gold:#FFC300;
  --xy-gold-soft:#FFF7DE;
  --xy-ink:#1B1B1D;
  --xy-ink-soft:#63636B;
  --xy-ink-faint:#A2A2AA;
  --xy-bg:#F4F3F1;
  --xy-card:#FFFFFF;
  --xy-line:#ECEBE8;
  --xy-green:#0EA972;
  --xy-green-bg:#E7F8F1;
  --xy-red:#FF3B30;
  --xy-red-bg:#FFECEA;
  --xy-warn-bg:#FFF7E8;
  --r-lg:22px;
  --r-md:16px;
  --r-sm:10px;
  --shadow:0 1px 2px rgba(20,15,10,.04), 0 10px 26px -14px rgba(20,15,10,.18);

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:var(--xy-bg);
  color:var(--xy-ink);
  display:flex;
  justify-content:center;
  min-height:100vh;
}
.device{
  width:100%;
  max-width:430px;
  min-height:100vh;
  background:var(--xy-bg);
  position:relative;
  display:flex;
  flex-direction:column;
}
.statusbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 22px 4px;
  font-size:14px;
  font-weight:600;
  color:var(--xy-ink);
  letter-spacing:.2px;
}
.statusbar .icons{display:flex;align-items:center;gap:5px;}
.navbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 16px 12px;
  position:sticky;
  top:0;
  background:var(--xy-bg);
  z-index:20;
}
.navbar .side{width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.navbar .side svg{display:block;}
.navbar h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.2px;}
.navbar .side.tap{cursor:pointer;border-radius:50%;background:rgba(0,0,0,.04);}
.navbar .side.tap:active{background:rgba(0,0,0,.09);}

.scroll{flex:1;overflow-y:auto;padding-bottom:110px;}
.px{padding-left:16px;padding-right:16px;}

.card{
  background:var(--xy-card);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow);
  padding:18px;
}
.section-title{
  font-size:13px;
  font-weight:700;
  color:var(--xy-ink-soft);
  letter-spacing:.5px;
  margin:22px 0 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.tag{
  display:inline-flex;
  align-items:center;
  padding:3px 9px;
  border-radius:100px;
  font-size:11.5px;
  font-weight:600;
  background:var(--xy-orange-soft);

}
.tag.gold{background:var(--xy-gold-soft);color:#8a6400;}
.tag.gray{background:#F0EFEC;color:var(--xy-ink-soft);}
.tag.green{background:var(--xy-green-bg);color:var(--xy-green);}

.btn{

  border-radius:100px;

.toggle.on{background:var(--xy-orange);}

<script>
// ===== UI helper: toast =====
let __toastTimer=null;
function showToast(msg, ms){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(__toastTimer);
  __toastTimer = setTimeout(()=>el.classList.remove('show'), ms||2200);
}

// ===== 闲鱼 · AI 自主清售计划 —— PRD v3.0 公式实现 =====
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function roundToTen(v){ return Math.round(v/10)*10; }

const STRATEGY = {
  profit: { label:'收益优先', a_s:0.50, k_s:0.25, kappa_s:0.10, gamma_adj:0.08 },
  balance:{ label:'平衡出售', a_s:0.20, k_s:-0.60, kappa_s:0.25, gamma_adj:0    }, // k_s 调到让 k≈1（线性匀速），呼应 PRD 05 页原文'温和匀速降价'，作为另外两条曲线之间真正的中间态
  fast:   { label:'尽快售出', a_s:-0.10,k_s:-1.10, kappa_s:0.35, gamma_adj:-0.06 } // k_s 刻意压到让 k 触底(0.65)，配合 calcPbase 的 elapsed 公式，画出'前陡后平'曲线
};
const LIQUIDITY = { high:1.90, mid:1.60, low:1.30 };

// 紧迫折扣：离场剩余总天数 T 越短于 14 天的默认基准，起始价越低；
// T>=14 时不产生折扣（保持与既有验证数据一致）；T<=7 时折扣封顶，避免起始价被压得过低。
function urgencyFactor(T){
  return clamp((14 - T) / (14 - 7), 0, 1);
}
function calcP0(Mlow, Mhigh, F, strategyKey, T){
  const M = (Mlow+Mhigh)/2, R = Mhigh-Mlow;
  const a_s = STRATEGY[strategyKey].a_s;
  const t = (typeof T === 'number' && T > 0) ? T : 14;
  const u = urgencyFactor(t);
  const BETA = 0.35; // 紧迫折扣强度：T=7 时最多再压低约 0.35×R
  return Math.round(clamp(M + a_s*R - u*BETA*R, F, Mhigh));
}
function calcK(strategyKey, liquidityKey){
  return clamp(LIQUIDITY[liquidityKey] + STRATEGY[strategyKey].k_s, 0.65, 2.40);
}
// 时间衰减曲线：指数作用在"已经过去的时间比例"上（而不是"剩余时间比例"上）。
// 这样 k 越大（如收益优先），早期 elapsed^k 越接近 0，价格长期贴着 P0；
// 只有临近截止（elapsed 接近 1）才会快速下探到 F —— 与 PRD 05 页"长期维持高位，
// 临近截止才加速降价"的描述一致。k 越小（如尽快售出）则相反：更早开始明显下降。
// 两端点严格不变：elapsed=0（day1）恒为 P0，elapsed=1（截止日）恒为 F。
function calcPbase(F, P0, r, T, k){
  const elapsed = T>0 ? clamp(1 - (r/T), 0, 1) : 1;
  return P0 - (P0-F) * Math.pow(elapsed, k);
}
function calcQ(fav, offerStrength, supply, lowDensity){
  return clamp(0.30*fav + 0.35*offerStrength - 0.20*supply - 0.15*lowDensity, -1, 1);
}
function calcPtarget(Pbase, R, Q, F, Pcurrent){
  return clamp(Pbase + 0.08*R*Q, F, Pcurrent);
}
function stepCapForR(r){
  if(r>=15) return 0.03;
  if(r>=9)  return 0.03;
  if(r>=4)  return 0.06;
  return 0.10;
}
function stepCapLabel(r){
  if(r>=15) return 'D30–D15 · 3%';
  if(r>=9)  return 'D14–D9 · 3%';
  if(r>=4)  return 'D8–D4 · 6%';
  return 'D3–D1 · 10%';
}
function calcPnext(Pcurrent, Ptarget, F, r){
  const cap = stepCapForR(r);
  return Math.max(F, Math.max(Pcurrent*(1-cap), Ptarget));
}
function checkFreqLabel(r){
  if(r>=15) return '每周一次';
  if(r>=9)  return '每 72 小时一次';
  if(r>=4)  return '每 48 小时一次';
  return '每天一次';
}

function calcKappa(strategyKey, r){
  const kappa_s = STRATEGY[strategyKey].kappa_s;
  let urgency = 0;
  if(r>=15) urgency=0; else if(r>=8) urgency=0.05; else if(r>=4) urgency=0.10; else urgency=0.15;
  return clamp(kappa_s+urgency, 0.05, 0.45);
}
function calcL(F, Pt, kappa){
  return Math.round(Math.max(0.85*F, F - kappa*(Pt-F)));
}
function calcGamma(strategyKey, r){
  let base=0;
  if(r>=15) base=0.25; else if(r>=8) base=0.15; else if(r>=4) base=0.08; else base=0;
  return clamp(base + STRATEGY[strategyKey].gamma_adj, 0, 0.35);
}
function calcC(F, Pt, gamma){
  return Math.round(clamp(F + gamma*(Pt-F), F, Pt));
}
// 四分支判定： 'reject' | 'counter' | 'valid' | 'atprice'
function decideOffer(B, L, F, Pt){
  if(B < L) return 'reject';
  if(B < F) return 'counter';
  if(B < Pt) return 'valid';
  return 'atprice';
}
