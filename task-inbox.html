<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>交易任务 · 闲鱼</title>
<style>
:root{--orange:#FF4B10;--orange-deep:#DE3900;--orange-soft:#FFF0EA;--ink:#1B1B1D;--soft:#63636B;--faint:#A2A2AA;--bg:#F4F3F1;--card:#fff;--line:#ECEBE8;--green:#0EA972;--green-bg:#E7F8F1;--warn:#FFF7E8;--r-lg:22px;--r-md:16px;--shadow:0 1px 2px rgba(20,15,10,.04),0 10px 26px -14px rgba(20,15,10,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center;min-height:100vh}.device{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative}.statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 4px;font-size:14px;font-weight:650}.icons{display:flex;gap:5px;align-items:center}.navbar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 12px;position:sticky;top:0;background:var(--bg);z-index:20}.navbar h1{font-size:17px;margin:0;font-weight:750}.side{width:36px;height:36px;display:flex;align-items:center;justify-content:center}.side.tap{background:rgba(0,0,0,.04);border-radius:50%;cursor:pointer}.scroll{flex:1;overflow-y:auto;padding:0 16px 100px}.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px}.section-title{font-size:13px;color:var(--soft);font-weight:750;letter-spacing:.4px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}.task-hero{background:linear-gradient(135deg,#262625,#161616);color:#fff}.task-hero h2{font-size:24px;margin:0;font-weight:850;letter-spacing:-.5px}.task-hero p{font-size:12.5px;color:rgba(255,255,255,.66);line-height:1.55;margin:8px 0 0}.task-count{display:inline-flex;align-items:center;gap:5px;margin-top:15px;padding:7px 10px;border-radius:99px;background:rgba(255,154,111,.16);color:#FFB294;font-size:12px;font-weight:800}.task-card{border:1.5px solid #BDE9D5;background:#F4FBF7;border-radius:var(--r-md);padding:13px;display:flex;gap:12px;align-items:center;cursor:pointer;color:var(--ink);width:100%;text-align:left;font-family:inherit}.task-card:active{transform:scale(.985)}.thumb{width:58px;height:58px;border-radius:12px;overflow:hidden;background:#fff;flex:0 0 auto}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.task-main{flex:1;min-width:0}.task-name,.task-meta,.handled-title,.handled-sub{display:block}.task-name{font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-meta{font-size:11.5px;color:var(--soft);margin-top:5px}.task-decision-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:7px}.task-reason{font-size:11.5px;color:#0A8558;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-price{font-size:17px;font-weight:850;color:var(--orange-deep);white-space:nowrap}.task-arrow{font-size:17px;color:var(--faint);margin-left:1px}.handled-card{padding:15px 16px;background:#FAFAF8;border:1px solid var(--line);box-shadow:none}.handled-row{display:grid;grid-template-columns:1fr auto;column-gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.handled-row:last-of-type{border:0;padding-bottom:7px}.handled-title{font-size:13px;font-weight:700}.handled-sub{font-size:11px;color:var(--faint);margin-top:4px}.handled-count{font-size:15px;font-weight:850;text-align:right;min-width:34px}.handled-note{font-size:12px;color:var(--soft);line-height:1.6;margin:10px 0 0}.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;z-index:30}.tabbar-inner{width:100%;max-width:430px;display:flex;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(6px + env(safe-area-inset-bottom))}.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;border-radius:12px;cursor:pointer;color:var(--faint)}.tab.active{color:var(--orange-deep)}.tab span{font-size:10.5px;font-weight:700}.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(27,27,29,.92);color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s,bottom .25s}.toast.show{opacity:1;bottom:130px}::-webkit-scrollbar{display:none}
</style>
</head>
<body><div class="device">
<div class="statusbar"><span>9:41</span><span class="icons"><svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx=".5" fill="#1B1B1D"/><rect x="5" y="5" width="3" height="7" rx=".5" fill="#1B1B1D"/><rect x="10" y="3" width="3" height="9" rx=".5" fill="#1B1B1D"/><rect x="15" y="0" width="3" height="12" rx=".5" fill="#1B1B1D"/></svg><svg width="24" height="12" viewBox="0 0 24 12"><rect x=".5" y=".5" width="20" height="11" rx="2.5" fill="none" stroke="#1B1B1D"/><rect x="2" y="2" width="15" height="8" rx="1.2" fill="#1B1B1D"/><rect x="21.5" y="4" width="1.8" height="4" rx=".8" fill="#1B1B1D"/></svg></span></div>
<div class="navbar"><div class="side tap" onclick="location.href='dashboard.html'"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="#1B1B1D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h1>交易任务</h1><div class="side"></div></div>
<main class="scroll">
  <section class="card task-hero"><h2>今天只需处理 1 笔交易</h2><p>AI 已筛选低价报价与还价中沟通，仅把需要你决定的交易交还给你。</p><div class="task-count"><span>●</span> 待确认交易 1 笔</div></section>
  <div class="section-title"><span>待你确认</span></div>

  <section class="card handled-card"><div class="handled-row"><span><span class="handled-title">自动拒绝低价报价</span><span class="handled-sub">无需你处理</span></span><b class="handled-count">6 笔</b></div><div class="handled-row"><span><span class="handled-title">已发起一次 AI 还价</span><span class="handled-sub">等待买家回应</span></span><b class="handled-count">2 笔</b></div><p class="handled-note">AI 不会自动成交，也不会承诺现实交接；包含特殊取货、打包或换物条件的交易会自动转入“待你确认”。</p></section>
</main>
<div class="tabbar"><div class="tabbar-inner"><div class="tab" onclick="location.href='dashboard.html'"><svg width="21" height="21" viewBox="0 0 24 24"><path d="M4 11.5L12 4l8 7.5" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>计划概览</span></div><div class="tab active" onclick="location.href='task-inbox.html'"><svg width="21" height="21" viewBox="0 0 24 24"><path d="M3 12h4l2 3h6l2-3h4" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 12l1.5-6.5A1 1 0 0 1 7.47 4h9.06a1 1 0 0 1 .97 1.5L19 12v6a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-6z" stroke="currentColor" fill="none" stroke-width="2" stroke-linejoin="round"/></svg><span>交易任务</span></div><div class="tab" onclick="location.href='results.html'"><svg width="21" height="21" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none" stroke-width="2"/><path d="M8.5 12.5l2.5 2.5 4.5-5" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>计划结果</span></div></div></div>
<div id="toast" class="toast"></div></div>
<script>
function openOfferDetail(){const demo=new URLSearchParams(location.search).get('mode')==='demo'?'&mode=demo':'';location.href='offer-engine.html?from=tasks'+demo}
</script><script src="mode.js"></script></body></html>
