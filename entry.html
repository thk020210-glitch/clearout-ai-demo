<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>发布成功 · 闲鱼</title>
<style>
:root{
  --xy-orange:#FF4B10;
  --xy-orange-deep:#DE3900;
  --xy-orange-soft:#FFF0EA;
  --xy-gold:#FFC300;
  --xy-gold-soft:#FFF7DE;
  --xy-ink:#1B1B1D;
  --xy-ink-soft:#63636B;
  --xy-ink-faint:#A2A2AA;
  --xy-bg:#F4F3F1;
  --xy-card:#FFFFFF;
  --xy-line:#ECEBE8;
  --xy-green:#0EA972;
  --xy-green-bg:#E7F8F1;
  --xy-red:#FF3B30;
  --xy-red-bg:#FFECEA;
  --xy-warn-bg:#FFF7E8;
  --r-lg:22px;
  --r-md:16px;
  --r-sm:10px;
  --shadow:0 1px 2px rgba(20,15,10,.04), 0 10px 26px -14px rgba(20,15,10,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:var(--xy-bg);
  color:var(--xy-ink);
  display:flex;
  justify-content:center;
  min-height:100vh;
}
.device{
  width:100%;
  max-width:430px;
  min-height:100vh;
  background:var(--xy-bg);
  position:relative;
  display:flex;
  flex-direction:column;
}
.statusbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 22px 4px;
  font-size:14px;
  font-weight:600;
  color:var(--xy-ink);
  letter-spacing:.2px;
}
.statusbar .icons{display:flex;align-items:center;gap:5px;}
.navbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 16px 12px;
  position:sticky;
  top:0;
  background:var(--xy-bg);
  z-index:20;
}
.navbar .side{width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.navbar .side svg{display:block;}
.navbar h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.2px;}
.navbar .side.tap{cursor:pointer;border-radius:50%;background:rgba(0,0,0,.04);}
.navbar .side.tap:active{background:rgba(0,0,0,.09);}

.scroll{flex:1;overflow-y:auto;padding-bottom:110px;}
.px{padding-left:16px;padding-right:16px;}

.card{
  background:var(--xy-card);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow);
  padding:18px;
}
.section-title{
  font-size:13px;
  font-weight:700;
  color:var(--xy-ink-soft);
  letter-spacing:.5px;
  margin:22px 0 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.tag{
  display:inline-flex;
  align-items:center;
  padding:3px 9px;
  border-radius:100px;
  font-size:11.5px;
  font-weight:600;
  background:var(--xy-orange-soft);
  color:var(--xy-orange-deep);
}
.tag.gold{background:var(--xy-gold-soft);color:#8a6400;}
.tag.gray{background:#F0EFEC;color:var(--xy-ink-soft);}
.tag.green{background:var(--xy-green-bg);color:var(--xy-green);}

.btn{
  border:none;
  border-radius:100px;
  font-size:15px;
  font-weight:700;
  padding:14px 20px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  transition:transform .15s ease, opacity .15s ease;
  font-family:inherit;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--xy-orange),var(--xy-orange-deep));color:#fff;box-shadow:0 10px 20px -10px rgba(255,75,16,.6);}
.btn-secondary{background:var(--xy-card);color:var(--xy-ink);border:1.5px solid var(--xy-line);}
.btn-ghost{background:transparent;color:var(--xy-ink-soft);border:1.5px solid var(--xy-line);}
.btn-block{width:100%;}
.btn-sm{padding:9px 14px;font-size:13px;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

.bottombar{
  position:fixed;
  bottom:0;left:0;right:0;
  display:flex;
  justify-content:center;
}
.bottombar-inner{
  width:100%;max-width:430px;
  padding:10px 16px calc(18px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg, rgba(244,243,241,0) 0%, var(--xy-bg) 30%);
  display:flex;gap:10px;
}

.explain{
  background:var(--xy-warn-bg);
  border-radius:var(--r-md);
  padding:14px 16px;
  font-size:13.5px;
  line-height:1.65;
  color:#7A5B00;
  border:1px solid #FBE7A8;
}
.explain b{color:#5b4200;}

.field-label{font-size:13px;color:var(--xy-ink-soft);font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;}
.field-label .val{color:var(--xy-orange-deep);font-weight:800;font-size:14px;}

input[type=range]{
  -webkit-appearance:none;width:100%;height:4px;border-radius:4px;
  background:var(--xy-line);outline:none;margin:6px 0 2px;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:#fff;border:3px solid var(--xy-orange);box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:pointer;
}
.seg{display:flex;background:#F0EFEC;border-radius:100px;padding:4px;gap:4px;}
.seg button{
  flex:1;border:none;background:transparent;padding:9px 4px;border-radius:100px;
  font-size:13px;font-weight:700;color:var(--xy-ink-soft);cursor:pointer;font-family:inherit;transition:all .18s ease;
}
.seg button.active{background:var(--xy-ink);color:#fff;}

.toggle{width:46px;height:27px;border-radius:100px;background:var(--xy-line);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;}
.toggle.on{background:var(--xy-orange);}
.toggle .knob{position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s;}
.toggle.on .knob{left:21.5px;}

.divider{height:1px;background:var(--xy-line);margin:14px 0;}

.hero-price{font-size:44px;font-weight:800;letter-spacing:-1px;color:var(--xy-ink);}
.hero-price .cny{font-size:22px;font-weight:700;margin-right:2px;color:var(--xy-orange-deep);}

.chip-row{display:flex;gap:8px;flex-wrap:wrap;}

.toast{
  position:fixed;left:50%;bottom:110px;transform:translateX(-50%);
  background:rgba(27,27,29,.92);color:#fff;padding:11px 18px;border-radius:100px;
  font-size:13.5px;font-weight:600;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s;
  white-space:nowrap;
}
.toast.show{opacity:1;bottom:130px;}

.item-card{
  background:var(--xy-card);border-radius:var(--r-md);padding:12px;display:flex;gap:12px;
  box-shadow:var(--shadow);margin-bottom:12px;align-items:center;cursor:pointer;transition:transform .15s;
}
.item-card:active{transform:scale(.98);}
.item-card.disabled{cursor:default;}
.item-card.disabled:active{transform:none;}
.item-thumb{
  width:64px;height:64px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;background:var(--xy-bg);
}
.badge-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}

.tabbar{
  position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;z-index:30;
}
.tabbar-inner{
  width:100%;max-width:430px;display:flex;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--xy-line);
  padding:8px 6px calc(6px + env(safe-area-inset-bottom));
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:5px 2px;border-radius:12px;cursor:pointer;color:var(--xy-ink-faint);
}
.tab.active{color:var(--xy-orange-deep);}
.tab span{font-size:10.5px;font-weight:700;}

::-webkit-scrollbar{display:none;}
a{text-decoration:none;color:inherit;}

</style>
</head>
<body>
<div class="device">
<div class="statusbar">
  <span>9:41</span>
  <span class="icons">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="#1B1B1D"/><rect x="5" y="5" width="3" height="7" rx="0.5" fill="#1B1B1D"/><rect x="10" y="3" width="3" height="9" rx="0.5" fill="#1B1B1D"/><rect x="15" y="0" width="3" height="12" rx="0.5" fill="#1B1B1D"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M1 4C4.5 0.5 11.5 0.5 15 4" stroke="#1B1B1D" stroke-width="1.6" stroke-linecap="round"/><path d="M3.5 6.8C6 4.3 10 4.3 12.5 6.8" stroke="#1B1B1D" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="10" r="1.4" fill="#1B1B1D"/></svg>
    <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="#1B1B1D"/><rect x="2" y="2" width="15" height="8" rx="1.2" fill="#1B1B1D"/><rect x="21.5" y="4" width="1.8" height="4" rx="0.8" fill="#1B1B1D"/></svg>
  </span>
</div>
<div class="navbar">
  <div class="side tap" onclick="history.back()"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="#1B1B1D" stroke-width="2.1" stroke-linecap="round"/></svg></div>
  <h1>发布成功</h1>
  <div class="side"></div>
</div>

<div class="scroll px">

  <div style="text-align:center;padding:22px 10px 8px;">
    <div style="width:64px;height:64px;margin:0 auto 14px;border-radius:20px;background:linear-gradient(135deg,var(--xy-gold),var(--xy-orange));display:flex;align-items:center;justify-content:center;box-shadow:0 12px 24px -10px rgba(255,120,20,.55);">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div style="font-size:20px;font-weight:800;">商品已发布</div>
    <div style="font-size:13.5px;color:var(--xy-ink-soft);margin-top:6px;line-height:1.6;">「Yamaha F310 民谣吉他」等 4 件商品<br>已进入你的「我卖出的」列表</div>
  </div>

  <div class="section-title">接下来，选择适合你的清售方式</div>

  <div class="card" style="margin-bottom:12px;">
    <div style="display:flex;gap:12px;align-items:flex-start;">
      <div style="width:44px;height:44px;border-radius:12px;background:#F0EFEC;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2.5" stroke="#63636B" stroke-width="1.8"/><path d="M3 10h18" stroke="#63636B" stroke-width="1.8"/><path d="M8 6V4.5A1.5 1.5 0 0 1 9.5 3h5A1.5 1.5 0 0 1 16 4.5V6" stroke="#63636B" stroke-width="1.8"/></svg>

      </div>

    <button class="btn btn-secondary btn-block" style="margin-top:14px;" onclick="showToast('本原型聚焦「自主清售计划」，无忧卖入口仅作并列展示')">了解无忧卖</button>

    <div style="display:flex;gap:12px;align-items:flex-start;">

        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="#fff"/></svg>

    <b>关于 AI 的权限边界：</b>AI 替你执行你已授权的规则（改价、拒绝低价、发起一次还价），但候选交易的最终确认、以及任何非标准条件，都会交回给你。V1 不承诺保证卖出。
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ===== UI helper: toast =====
let __toastTimer=null;
function showToast(msg, ms){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(__toastTimer);
  __toastTimer = setTimeout(()=>el.classList.remove('show'), ms||2200);
}

// ===== 闲鱼 · AI 自主清售计划 —— PRD v3.0 公式实现 =====
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function roundToTen(v){ return Math.round(v/10)*10; }

const STRATEGY = {
  profit: { label:'收益优先', a_s:0.50, k_s:0.25, kappa_s:0.10, gamma_adj:0.08 },
  balance:{ label:'平衡出售', a_s:0.20, k_s:0,    kappa_s:0.25, gamma_adj:0    },
  fast:   { label:'尽快售出', a_s:-0.10,k_s:-0.25, kappa_s:0.35, gamma_adj:-0.06 }
};
const LIQUIDITY = { high:1.90, mid:1.60, low:1.30 };

function calcP0(Mlow, Mhigh, F, strategyKey){
  const M = (Mlow+Mhigh)/2, R = Mhigh-Mlow;
  const a_s = STRATEGY[strategyKey].a_s;
  return Math.round(clamp(M + a_s*R, F, Mhigh));
}
function calcK(strategyKey, liquidityKey){
  return clamp(LIQUIDITY[liquidityKey] + STRATEGY[strategyKey].k_s, 0.65, 2.40);
}
function calcPbase(F, P0, r, T, k){
  const ratio = T>0 ? clamp(r/T,0,1) : 0;
  return F + (P0-F) * Math.pow(ratio, k);
}
function calcQ(fav, offerStrength, supply, lowDensity){
  return clamp(0.30*fav + 0.35*offerStrength - 0.20*supply - 0.15*lowDensity, -1, 1);
}
function calcPtarget(Pbase, R, Q, F, Pcurrent){
  return clamp(Pbase + 0.08*R*Q, F, Pcurrent);
}
function stepCapForR(r){
  if(r>=15) return 0.03;
  if(r>=9)  return 0.03;
  if(r>=4)  return 0.06;
  return 0.10;
}
function stepCapLabel(r){
  if(r>=15) return 'D30–D15 · 3%';
  if(r>=9)  return 'D14–D9 · 3%';
  if(r>=4)  return 'D8–D4 · 6%';
  return 'D3–D1 · 10%';
}
function calcPnext(Pcurrent, Ptarget, F, r){
  const cap = stepCapForR(r);
  return Math.max(F, Math.max(Pcurrent*(1-cap), Ptarget));
}
function checkFreqLabel(r){
  if(r>=15) return '每周一次';
  if(r>=9)  return '每 72 小时一次';
  if(r>=4)  return '每 48 小时一次';
  return '每天一次';
}

function calcKappa(strategyKey, r){
  const kappa_s = STRATEGY[strategyKey].kappa_s;
  let urgency = 0;
  if(r>=15) urgency=0; else if(r>=8) urgency=0.05; else if(r>=4) urgency=0.10; else urgency=0.15;
  return clamp(kappa_s+urgency, 0.05, 0.45);
}
function calcL(F, Pt, kappa){
  return Math.round(Math.max(0.85*F, F - kappa*(Pt-F)));
}
function calcGamma(strategyKey, r){
  let base=0;
  if(r>=15) base=0.25; else if(r>=8) base=0.15; else if(r>=4) base=0.08; else base=0;
  return clamp(base + STRATEGY[strategyKey].gamma_adj, 0, 0.35);
}
function calcC(F, Pt, gamma){
  return Math.round(clamp(F + gamma*(Pt-F), F, Pt));
}
// 四分支判定： 'reject' | 'counter' | 'valid' | 'atprice'
function decideOffer(B, L, F, Pt){
  if(B < L) return 'reject';
  if(B < F) return 'counter';
  if(B < Pt) return 'valid';
  return 'atprice';
}
